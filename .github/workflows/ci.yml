name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/tariff-service

    services:
      # Postgres desechable, solo para este job. No tiene relacion con el
      # docker-compose.yml del repo: spring-boot-docker-compose esta
      # desactivado durante los tests (spring.docker.compose.skip.in-tests).
      #
      # Hace falta en cuanto haya un @SpringBootTest con tests activos:
      # levanta el contexto entero, JPA incluido, y sin DataSource real no
      # arranca. Hoy TariffServiceApplicationTests tiene el @Test comentado,
      # asi que el contexto no llega a cargarse.
      #
      # Usuario, password y base deben coincidir con las variables TARIFF_DB_*
      # del paso "Build + test", que son las que lee
      # src/test/resources/application.properties.
      postgres:
        image: postgres:15.18-alpine
        env:
          POSTGRES_USER: tariff_user
          POSTGRES_PASSWORD: tariff_pass
          POSTGRES_DB: tariff_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tariff_user -d tariff_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para calcular el
          # "new code" (blame por commit) al evaluar el quality gate.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          # El pom compila a bytecode 17 (maven.compiler source/target) pero el
          # runner usa 21: SonarQube Cloud dejo de soportar analizar con JDK 17
          # desde julio 2026. Lombok 1.18.30 soporta 21 sin problema (el limite
          # documentado es JDK 25).
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + test
        env:
          TARIFF_DB_HOST: localhost
          # El service container expone el 5432 directo. El 5435 del compose es
          # solo el mapeo en local para no chocar con otros Postgres.
          TARIFF_DB_PORT: 5432
          TARIFF_DB_NAME: tariff_db
          TARIFF_DB_USER: tariff_user
          TARIFF_DB_PASSWORD: tariff_pass
        run: ./mvnw -B verify

      - name: Cache paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Requiere el secret SONAR_TOKEN del repo.
      - name: Analisis SonarCloud (quality gate)
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.projectKey=1dd0rv_tartis-recon-ai-parking-tariffService
          -Dsonar.organization=1dd0rv
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
