name: CI

on:
  pull_request:
  push:
    branches: [main, release, release123]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/tariff-service

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para calcular el
          # "new code" (blame por commit) al evaluar el quality gate.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build + test
        run: ./mvnw -B verify

      - name: Cache paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Requiere el secret SONAR_TOKEN del repo.
      - name: Analisis SonarCloud (quality gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.projectKey=1dd0rv_tartis-recon-ai-parking-tariffService
          -Dsonar.organization=1dd0rv
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
