name: CI

on:
  pull_request:
  push:
    branches: [main, release, release123]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/tariff-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # El pom compila a bytecode 17 (maven.compiler source/target) pero el
          # runner usa 21: SonarQube Cloud dejo de soportar analizar con JDK 17
          # desde julio 2026. Lombok 1.18.30 soporta 21 sin problema (el limite
          # documentado es JDK 25).
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # TODO: quitar -DskipTests (y anadir el Postgres como service container,
      # ver el ci.yml de vehicle-service) cuando el dominio de tariff-service
      # este implementado. Hoy TariffEntity es una clase vacia sin @Entity/@Id,
      # asi que el @SpringBootTest no puede arrancar el contexto.
      - name: Build
        run: ./mvnw -B verify -DskipTests
