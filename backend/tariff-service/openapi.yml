openapi: 3.0.3
info:
  title: tariff-service API
  description: >
    Manages tariff configuration per vehicle type (HU-04) and exposes the
    pricing calculation used synchronously by stay-service during
    check-out.

    PRICING RULES applied by /tariffs/calculate:
      RN-09 minimum charge & courtesy: 0.10 EUR access fee; first
        courtesyMinutes (10) are included before per-minute billing starts.
      RN-07 tiered rates: 0.03 EUR/min, 0.02 EUR/min once a full hour is
        completed, 0.01 EUR/min once a full day is completed.
      RN-08 staggered accumulation: amount already accrued in a lower tier
        is preserved when crossing into the next tier; the new rate applies
        only from that point forward (not retroactively to the whole
        duration).
      RN-06 total minutes are rounded up in the system's favor (rounding
        itself happens in stay-service before calling this endpoint).
    IN-08 invariant: at most one active tariff per vehicle type at any
    given instant (no overlapping validity) — enforced by activating a new
    tariff and deactivating the previous one for that vehicleType in the
    same operation.

    ASSUMPTION (flagged, not explicit in source docs): the technical
    document states stay-service "calls tariff-service to get the current
    tariff" and separately that check-out "calculates the amount (duration
    x tariff)", without saying which service owns the tiered-pricing math
    (RN-07/RN-08). This contract exposes both: GET /tariffs/current (raw
    tariff data) and POST /tariffs/calculate (full RN-06..RN-09 calculation
    server-side). Putting the calculation here keeps pricing logic in one
    place (tariff-service's own domain) instead of duplicating RN-07/RN-08
    tier logic inside stay-service — confirm this split with the team
    before implementing StayTariffPort.

    All endpoints require a valid JWT bearer token (Keycloak). Role-based
    access is enforced via @PreAuthorize (SEC-10); see the security matrix
    in docs/SEC-03 for the full ADMIN / OPERARIO / SERVICE breakdown.
  version: 1.0.0
  contact:
    name: TARTIS Recon-AI - Team Parking

servers:
  - url: /v1

tags:
  - name: tariffs
    description: Tariff management and amount calculation

# Todas las operaciones requieren token JWT (bearerAuth). Solo el health check
# de actuator (/actuator/health) es publico y queda fuera de este contrato.
# SEC-13: securityScheme aplicado a nivel de documento.
security:
  - bearerAuth: []

paths:
  /tariffs:
    get:
      tags: [tariffs]
      operationId: listTariffs
      summary: Lists registered tariffs (HU-04 CA1)
      parameters:
        - name: vehicleType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VehicleType'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page of tariffs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [tariffs]
      operationId: createTariff
      summary: Creates a new tariff (HU-04 CA3, CA4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffCreateRequest'
      responses:
        '201':
          description: Tariff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tariffs/{tariffId}:
    get:
      tags: [tariffs]
      operationId: getTariff
      summary: Retrieves a tariff by ID (HU-04 CA2)
      parameters:
        - $ref: '#/components/parameters/TariffIdPath'
      responses:
        '200':
          description: Tariff detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [tariffs]
      operationId: updateTariff
      summary: Updates tariff data (HU-04 CA5)
      parameters:
        - $ref: '#/components/parameters/TariffIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffUpdateRequest'
      responses:
        '200':
          description: Tariff updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tariffs/{tariffId}/deactivate:
    patch:
      tags: [tariffs]
      operationId: deactivateTariff
      summary: >
        Marks a tariff as inactive (HU-04 CA6). Inactive tariffs are never
        used to calculate amounts for new stays (HU-04 CA7).
      parameters:
        - $ref: '#/components/parameters/TariffIdPath'
      responses:
        '200':
          description: Tariff deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tariffs/current:
    get:
      tags: [tariffs]
      operationId: getCurrentTariff
      summary: Retrieves the currently active tariff for a vehicle type (IN-08)
      parameters:
        - name: vehicleType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/VehicleType'
      responses:
        '200':
          description: Active tariff for the given vehicle type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active tariff configured for the given vehicle type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /tariffs/calculate:
    post:
      tags: [tariffs]
      operationId: calculateAmount
      summary: >
        Calculates the amount for a stay applying RN-06 (rounded minutes),
        RN-07/RN-08 (tiered, staggered rates) and RN-09 (minimum charge +
        courtesy minutes). Called synchronously by stay-service at
        check-out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateAmountRequest'
      responses:
        '200':
          description: Calculated amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateAmountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active tariff configured for the given vehicle type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  schemas:

    VehicleType:
      type: string
      description: Canonical enum from the domain model, shared with stay-service
      enum: [CAR, CAR_PMR, MOTORBIKE]

    Tariff:
      type: object
      properties:
        tariffId:
          type: string
          format: uuid
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        minimumCharge:
          type: number
          format: double
          example: 0.10
          description: Access fee (RN-09)
        courtesyMinutes:
          type: integer
          example: 10
          description: Minutes included before per-minute billing starts (RN-09)
        pricePerMinute:
          type: number
          format: double
          example: 0.03
          description: Rate applied before completing 1 hour (RN-07)
        pricePerHourTier:
          type: number
          format: double
          example: 0.02
          description: Rate applied per minute once 1 hour is completed (RN-07)
        pricePerDayTier:
          type: number
          format: double
          example: 0.01
          description: Rate applied per minute once 1 day is completed (RN-07)
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TariffCreateRequest:
      type: object
      required:
        - vehicleType
        - minimumCharge
        - courtesyMinutes
        - pricePerMinute
        - pricePerHourTier
        - pricePerDayTier
      properties:
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        minimumCharge:
          type: number
          format: double
        courtesyMinutes:
          type: integer
        pricePerMinute:
          type: number
          format: double
        pricePerHourTier:
          type: number
          format: double
        pricePerDayTier:
          type: number
          format: double

    TariffUpdateRequest:
      $ref: '#/components/schemas/TariffCreateRequest'

    TariffResponse:
      $ref: '#/components/schemas/Tariff'

    TariffPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    CalculateAmountRequest:
      type: object
      required: [vehicleType, totalMinutes]
      properties:
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        totalMinutes:
          type: integer
          description: Already rounded up in the system's favor by stay-service (RN-06)

    CalculateAmountResponse:
      type: object
      properties:
        tariffId:
          type: string
          format: uuid
        amount:
          type: number
          format: double

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "No active tariff for vehicle type CAR"
        path:
          type: string
          example: "/v1/tariffs/current"

  parameters:
    TariffIdPath:
      name: tariffId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request (field validation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Tariff not found (HU-04 CA8)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >
        The request conflicts with the current state of the resource: the
        tariff name is already taken, or a concurrent modification was
        detected (deadlock / optimistic lock). The client may retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: >
        No valid JWT bearer token was provided. The client must
        authenticate via Keycloak before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >
        The authenticated principal does not have the required role
        (ADMIN, OPERARIO, or SERVICE) for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >
        The service cannot reach its datastore (unavailable, or the query
        timed out). This is transient; retry after the delay indicated in
        the Retry-After header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT