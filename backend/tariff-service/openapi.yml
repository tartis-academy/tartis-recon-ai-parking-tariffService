openapi: 3.0.3
info:
  title: tariff-service API
  version: 1.1.0
  description: >
    Manages tariff configuration per vehicle type (HU-04) and exposes the
    pricing calculation used synchronously by stay-service during
    check-out.

    Tariff model is a LINEAR rate: basePrice plus pricePerMinute * elapsed
    minutes (minutes are rounded up in the system's favor by stay-service,
    RN-06, before calling /tariffs/calculate). At most one active tariff per
    vehicle type holds at any time (IN-08): registering a new tariff that
    will serve new stays is done by setting the desired `active` flag, and
    toggling that flag is the mechanism that replaces the previous tariff
    for the vehicle type.

    All endpoints require a valid JWT bearer token (Keycloak). Role-based
    access is enforced via @PreAuthorize (SEC-10): read operations
    (GET /tariffs, GET /tariffs/{id}, GET /tariffs/active) and price
    calculation (POST /tariffs/calculate) allow ADMIN and OPERARIO;
    management operations (POST /tariffs, PUT /tariffs/{id},
    PATCH /tariffs/{id}/status) are ADMIN-only.
  contact:
    name: TARTIS Recon-AI - Team Parking

servers:
  - url: /v1

tags:
  - name: tariffs
    description: Tariff management and amount calculation

# Todas las operaciones requieren token JWT (bearerAuth). Solo el health check
# de actuator (/actuator/health) es publico y queda fuera de este contrato.
# SEC-13: securityScheme aplicado a nivel de documento.
security:
  - bearerAuth: []

paths:
  /tariffs/active:
    get:
      tags: [tariffs]
      operationId: getActiveTariffs
      summary: Retrieves the active tariffs for a vehicle type (IN-08)
      description: >
        Returns a list with the currently active tariff(s) for the given
        `type`; at most one active tariff per type exists (IN-08).
      parameters:
        - name: type
          in: query
          required: true
          description: Filter active tariffs by vehicle type
          schema:
            $ref: '#/components/schemas/VehicleType'
      responses:
        '200':
          description: List of active tariffs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TariffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tariffs:
    get:
      tags: [tariffs]
      operationId: listTariffs
      summary: Lists all registered tariffs (HU-04 CA1)
      responses:
        '200':
          description: List of tariffs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TariffResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tariffs]
      operationId: createTariff
      summary: Creates a new tariff (HU-04 CA3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffCreateRequest'
      responses:
        '201':
          description: Tariff created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tariffs/{id}:
    get:
      tags: [tariffs]
      operationId: getTariff
      summary: Retrieves a tariff by id (HU-04 CA2)
      parameters:
        - $ref: '#/components/parameters/TariffIdPath'
      responses:
        '200':
          description: Tariff detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [tariffs]
      operationId: updateTariff
      summary: Updates a tariff (HU-04 CA5)
      description: >
        Updates editable fields (name, pricePerMinute, basePrice). The vehicle
        type and the active flag are not modified here
        (use PATCH /tariffs/{id}/status for the flag).
      parameters:
        - $ref: '#/components/parameters/TariffIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffUpdateRequest'
      responses:
        '200':
          description: Tariff updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tariffs/{id}/status:
    patch:
      tags: [tariffs]
      operationId: changeTariffStatus
      summary: Activates or deactivates a tariff (HU-04 CA6)
      description: >
        The request body controls the target state: active=true activates the
        tariff, active=false deactivates it. Inactive tariffs are never used
        to calculate amounts for new stays (HU-04 CA7).
      parameters:
        - $ref: '#/components/parameters/TariffIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffStatusRequest'
      responses:
        '200':
          description: Tariff status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tariffs/calculate:
    post:
      tags: [tariffs]
      operationId: calculatePrice
      summary: >
        Calculates the price of a stay (basePrice + pricePerMinute * minutes)
        for the given tariffId. Called synchronously by stay-service at
        check-out with minutes already rounded up (RN-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffPriceRequest'
      responses:
        '200':
          description: Calculated price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No tariff found for the given tariffId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:

    VehicleType:
      type: string
      description: Canonical enum from the domain model, shared with stay-service
      enum: [CAR, CAR_PMR, MOTORBIKE]

    TariffCreateRequest:
      type: object
      required: [name, type, pricePerMinute, basePrice, active]
      properties:
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/VehicleType'
        pricePerMinute:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Price per minute, must be > 0
        basePrice:
          type: number
          format: double
          minimum: 0
          description: Flat base price, must be >= 0
        active:
          type: boolean

    TariffUpdateRequest:
      type: object
      required: [name, pricePerMinute, basePrice]
      properties:
        name:
          type: string
          maxLength: 255
        pricePerMinute:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Price per minute, must be > 0
        basePrice:
          type: number
          format: double
          minimum: 0
          description: Flat base price, must be >= 0

    TariffStatusRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          description: true activates the tariff, false deactivates it

    TariffPriceRequest:
      type: object
      required: [tariffId, type, minutes]
      properties:
        tariffId:
          type: string
          format: uuid
          description: The tariff to calculate against (the tarif associated to the stay)
        type:
          $ref: '#/components/schemas/VehicleType'
        minutes:
          type: integer
          description: Total minutes, already rounded up by stay-service (RN-06)

    TariffResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/VehicleType'
        pricePerMinute:
          type: number
          format: double
        basePrice:
          type: number
          format: double
        active:
          type: boolean

    PriceResponse:
      type: object
      properties:
        price:
          type: number
          format: double

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "No active tariff for vehicle type CAR"
        path:
          type: string
          example: "/v1/tariffs/calculate"

  parameters:
    TariffIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request (field validation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Tariff not found (HU-04 CA8)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >
        The request conflicts with the current state of the resource, e.g. a
        concurrent modification was detected (optimistic lock). The client may
        retry against the latest version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: >
        No valid JWT bearer token was provided. The client must
        authenticate via Keycloak before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >
        The authenticated principal does not have the required role
        (ADMIN or OPERARIO) for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT