# BD dedicada del microservicio (database-per-service).
spring.datasource.url=jdbc:postgresql://${TARIFF_DB_HOST}:${TARIFF_DB_PORT:5432}/${TARIFF_DB_NAME:tariff_db}
spring.datasource.username=${TARIFF_DB_USER}
spring.datasource.password=${TARIFF_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.devtools.restart.enabled=false

# SEC-07 (revision PR #44, actualizado 30/07): a proposito NO hay aqui ni
# issuer-uri ni jwk-set-uri. Infra los inyecta por variable de entorno en
# docker-compose.demo.yml (SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
# / ..._JWK_SET_URI, relaxed binding de Spring), con jwk-set-uri apuntando al
# hostname interno de Docker e issuer-uri al externo (localhost:8180, el que
# trae el token de verdad y el que tiene fijado kong/kong.yml). Es la misma
# fuente para los 5 servicios - duplicar valores por defecto aqui solo
# arriesga que se desincronicen. Si esta variable no llega nunca, el fallo es
# claro al arrancar ("required a bean of type JwtDecoder"), no silencioso.
