# BD dedicada del microservicio (database-per-service).
spring.datasource.url=jdbc:postgresql://${TARIFF_DB_HOST}:${TARIFF_DB_PORT:5432}/${TARIFF_DB_NAME:tariff_db}
spring.datasource.username=${TARIFF_DB_USER}
spring.datasource.password=${TARIFF_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.devtools.restart.enabled=false

# SEC-07 (revision PR #44): sin esto, la app no arranca en prod - no habia
# ningun bean JwtDecoder, porque application-dev.properties (donde vivia el
# antiguo issuer-uri) nunca se carga con este perfil. jwk-set-uri apunta al
# hostname interno de Docker (donde SI se puede llegar a Keycloak desde
# dentro del contenedor); issuer se queda en localhost:8180 porque es el iss
# real que trae el token (Keycloak responde al navegador en ese host) y el
# mismo valor que tiene fijado el consumer de kong/kong.yml - cambiarlo aqui
# rompe la validacion aunque el token sea valido. Ver SecurityConfig.jwtDecoder().
security.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/parking/protocol/openid-connect/certs}
security.jwt.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/parking}
