# Postgres compartido de dev (5 schemas, uno por servicio) -> variables DB_* genericas, no TARIFF_DB_*.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_dev}
spring.datasource.username=${DB_USER:parking_dev}
spring.datasource.password=${DB_PASSWORD:change.me}
spring.jpa.properties.hibernate.default_schema=tariff

# SEC-07 (revision PR #44): jwk-set-uri (de donde se bajan las claves) e
# issuer (lo que se exige en el claim iss) van separados a proposito - ver el
# comentario en SecurityConfig.jwtDecoder(). En dev, ambos apuntan a
# localhost porque el proceso corre en el host, no dentro de Docker.
security.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/parking/protocol/openid-connect/certs}
security.jwt.issuer=${KEYCLOAK_ISSUER:http://localhost:8180/realms/parking}

spring.jpa.hibernate.ddl-auto=update

# Flyway apunta al schema por defecto de la conexion (public), no al schema
# "tariff" de este servicio en el Postgres compartido de dev: sin esto
# crearia tablas huerfanas en public. Fuera de alcance de RECON-812 (que solo
# cubre las Postgres dedicadas de demo/prod); ddl-auto=update sigue
# gestionando el esquema aqui, igual que antes.
spring.flyway.enabled=false
