spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Hibernate ya crea y destruye el esquema en cada run; Flyway no aporta nada
# aqui y solo anadiria una flyway_schema_history de mas.
spring.flyway.enabled=false

# SEC-07: este fichero tapa a src/main/resources/application.properties en el
# classpath de test, asi que application-dev.properties nunca se carga aqui y
# sin esto SecurityConfig.jwtDecoder() no puede resolver ${security.jwt.*}
# (mismo problema que en vehicle-service/SEC-04 y spot-service/SEC-06).
# Ninguno de los dos valores necesita ser alcanzable: NimbusJwtDecoder.withJwkSetUri()
# no llama a la red al construirse (solo al decodificar de verdad, y los tests
# usan .with(jwt()), que no pasa por el decoder real).
security.jwt.jwk-set-uri=http://localhost:8180/realms/parking/protocol/openid-connect/certs
security.jwt.issuer=http://localhost:8180/realms/parking
