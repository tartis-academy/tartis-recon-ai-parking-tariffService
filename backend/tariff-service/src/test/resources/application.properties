spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Hibernate ya crea y destruye el esquema en cada run; Flyway no aporta nada
# aqui y solo anadiria una flyway_schema_history de mas.
spring.flyway.enabled=false

# SEC-07: este fichero tapa a src/main/resources/application.properties en el
# classpath de test, asi que application-dev.properties nunca se carga aqui y
# sin esto SecurityConfig no encuentra un bean JwtDecoder (mismo problema que
# en vehicle-service/SEC-04 y spot-service/SEC-06). El valor no necesita ser
# alcanzable: los tests no llegan a decodificar ningun token de verdad.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/parking
